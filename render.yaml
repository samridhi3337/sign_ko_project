services:
  - type: web
    name: signbridge
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: ENABLE_LOCAL_RECOGNITION
        value: "false"
